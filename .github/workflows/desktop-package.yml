name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (${{ matrix.target-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target-name: windows-x64
            os: windows-latest
            rust-target: ''
            bundles: nsis
            artifact: mnelys-windows-x64
            paths: |
              target/release/bundle/nsis/*.exe
              target/release/mnelys.exe
          - target-name: macos-arm64
            os: macos-latest
            rust-target: --target aarch64-apple-darwin
            bundles: dmg
            artifact: mnelys-macos-arm64
            paths: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - target-name: linux-x64
            os: ubuntu-22.04
            rust-target: ''
            bundles: appimage
            artifact: mnelys-linux-x64
            paths: target/release/bundle/appimage/*.AppImage

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libfuse2 \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundle
        shell: bash
        run: pnpm exec tauri build --ci ${{ matrix.rust-target }} --bundles ${{ matrix.bundles }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14
