[package]
name = "mnelys"
version = "0.1.0"
description = "Mnelys / 忆涟 — AI-native Minecraft launcher and developer workspace"
authors = ["sdf123098"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
# `staticlib`/`cdylib` keep the door open for mobile targets later; `rlib` is what the
# binary and the integration tests link against.
name = "mnelys_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.7.0", features = [] }

[dependencies]
tauri = { version = "~2.12.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
